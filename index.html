<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kim's Game Challenge</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f3f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .controls {
      margin-bottom: 25px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 950px;
      /* Necesario para la animación de reordenamiento */
      position: relative; 
    }

    .card {
      background-color: white;
      border: 1px solid #e0e6ed;
      border-radius: 12px;
      padding: 25px 10px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      
      /* Animaciones suaves para movimiento y desaparición */
      transition: opacity 0.5s ease, transform 0.5s ease, order 0.5s ease;
      
      /* Asegura que el cambio de 'order' en flex/grid sea animable indirectamente */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Clase para desvanecer las palabras */
    .card.hidden {
      opacity: 0;
      transform: scale(0.5) rotate(15deg);
      pointer-events: none; /* Evita interacciones */
      /* Usamos display none tras la animación para que el grid se ajuste */
      transition: opacity 0.5s ease, transform 0.5s ease, display 0s linear 0.5s; 
    }
    
    /* Estado final real para quitar el espacio en el grid */
    .card.hidden.removed {
        display: none;
    }

  </style>
</head>
<body>

  <h1>Kim's Game: Adjectives</h1>
  
  <div class="controls">
    <button id="vanish-btn">Mix & Vanish! ✨</button>
  </div>

  <div class="grid" id="word-grid"></div>

  <script>
    // Tu lista de adjetivos
    const adjectives = [
      "tall", "short", "fast", "slow",
      "pretty", "handsome", "young", "old",
      "new", "high", "low", "cheap",
      "expensive", "easy", "difficult", "good",
      "bad", "right", "wrong", "hot",
      "warm", "cold"
    ];

    const grid = document.getElementById("word-grid");
    const vanishBtn = document.getElementById("vanish-btn");

    // Función para barajar un array (Fisher-Yates shuffle)
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 1. Barajar inicialmente la lista
    const shuffledAdjectives = shuffle([...adjectives]);

    // 2. Renderizar las palabras en la pantalla
    shuffledAdjectives.forEach((word) => {
      const card = document.createElement("div");
      card.classList.add("card");
      card.textContent = word;
      grid.appendChild(card);
    });

    // Evento del botón
    vanishBtn.addEventListener("click", () => {
      // Bloquear botón temporalmente durante la animación
      vanishBtn.disabled = true;

      const visibleCards = Array.from(document.querySelectorAll(".card:not(.hidden)"));
      
      if (visibleCards.length <= 1) return;

      // --- PASO 1: Mezclar posiciones ---
      // Creamos un array de índices y lo barajamos
      const indices = Array.from({length: visibleCards.length}, (_, i) => i);
      shuffle(indices);

      // Asignamos una nueva propiedad 'order' de CSS aleatoria a cada tarjeta
      visibleCards.forEach((card, index) => {
        card.style.order = indices[index];
      });

      // --- PASO 2: Desaparecer una palabra (después de un pequeño delay) ---
      // Esperamos a que la animación de movimiento (0.5s) esté avanzada
      setTimeout(() => {
        // Seleccionar una tarjeta visible al azar de las que quedan
        const cardToRemove = visibleCards[Math.floor(Math.random() * visibleCards.length)];
        
        // Iniciar animación de desaparición
        cardToRemove.classList.add("hidden");

        // Quitarla del layout completamente después de que termine su animación
        setTimeout(() => {
            cardToRemove.classList.add("removed");
            
            // Re-evaluar estado del juego
            const remainingCards = document.querySelectorAll(".card:not(.hidden)");
            
            if (remainingCards.length > 1) {
                // Reactivar botón si quedan más de una
                vanishBtn.disabled = false;
            } else {
                // Fin del juego
                vanishBtn.textContent = "Last One Standing!";
                vanishBtn.style.backgroundColor = "#28a745"; // Verde final
            }
        }, 500); // Mismo tiempo que la transición CSS de .card

      }, 300); // Retraso para que se vea el movimiento antes de desaparecer
    });
  </script>
</body>
</html>
